name: Secret probe

# Throwaway diagnostic: does this repository's NPM_TOKEN actually reach a workflow?
# Prints booleans only — never the value itself.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Which contexts see the secret?
        shell: bash
        run: |
          echo "repository: ${{ github.repository }}"
          echo "ref: ${{ github.ref_name }}  event: ${{ github.event_name }}"
          echo "secrets.NPM_TOKEN non-empty: ${{ secrets.NPM_TOKEN != '' }}"
          echo "env.NPM_TOKEN non-empty:     ${{ env.NPM_TOKEN != '' }}"
          if [ -n "$NPM_TOKEN" ]; then echo "shell \$NPM_TOKEN non-empty: true (length ${#NPM_TOKEN})"; else echo "shell \$NPM_TOKEN non-empty: false"; fi
          echo "NODE_AUTH_TOKEN visible at job env: ${{ secrets.NODE_AUTH_TOKEN != '' }}"
