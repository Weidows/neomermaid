name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm provenance, and for Entra ID (OIDC) authentication to the
  # Visual Studio Marketplace — neither uses a long-lived secret.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Marketplace authentication. `VSCE_PAT` still works today; Azure DevOps global
      # PATs retire on 2026-12-01, and the documented replacement is Microsoft Entra ID
      # with workload identity federation ("secure automated publishing"), which needs
      # no stored secret at all — see docs/publishing.md.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify the tag matches the package versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(node -p "require('./packages/core/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          VSX=$(node -p "require('./packages/vscode/package.json').version")
          echo "tag=$TAG core=$CORE cli=$CLI vscode=$VSX"
          [ "$TAG" = "$CORE" ] || { echo "tag does not match @neomermaid/core version"; exit 1; }
          [ "$TAG" = "$CLI" ] || { echo "tag does not match @neomermaid/cli version"; exit 1; }

      - name: Publish @neomermaid/core
        if: env.NPM_TOKEN != ''
        run: npm publish --workspace @neomermaid/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish @neomermaid/cli
        if: env.NPM_TOKEN != ''
        run: npm publish --workspace @neomermaid/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: NPM_TOKEN is missing
        if: env.NPM_TOKEN == ''
        shell: bash
        run: |
          echo "::warning::NPM_TOKEN is empty — nothing was published."
          echo "A registered secret whose value is blank expands to '' here, which is why"
          echo "this gate exists: check with"
          echo "  gh api repos/$GITHUB_REPOSITORY/actions/secrets --jq '.secrets[].name'"
          echo "then re-set it (npmjs.com -> Access Tokens -> Granular, scope @neomermaid,"
          echo "Read and write, bypass 2FA) via: gh secret set NPM_TOKEN"
          echo "See docs/publishing.md. A tag release fails here on purpose: a tag that"
          echo "silently does not publish is worse than a red run."
          # A tag release is meant to publish; a manual dry run is not.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then exit 1; fi

      - name: Build the VS Code extension
        run: node scripts/build-vscode.mjs

      - name: Package the .vsix
        run: npm run package --workspace neomermaid-vscode

      # ------------------------------------------------------------------ marketplace
      # Two ways to authenticate, tried in order. Publishing is skipped (with a notice)
      # when neither is configured, so a tag never fails just because the marketplace
      # credentials are missing.

      - name: Log in to Azure with OIDC (Entra ID)
        if: env.VSCE_PAT == '' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the Marketplace with Entra ID
        if: env.VSCE_PAT == '' && env.AZURE_CLIENT_ID != ''
        run: >-
          npx --yes @vscode/vsce@latest publish
          --packagePath packages/vscode/*.vsix
          --azure-credential

      - name: Publish to the Marketplace with a PAT
        if: env.VSCE_PAT != ''
        run: >-
          npx --yes @vscode/vsce@latest publish
          --packagePath packages/vscode/*.vsix
          --pat "$VSCE_PAT"

      - name: Marketplace skip notice
        if: env.VSCE_PAT == '' && env.AZURE_CLIENT_ID == ''
        run: |
          echo "Neither VSCE_PAT nor AZURE_CLIENT_ID is configured — the .vsix was built and"
          echo "attached to the release, but not published to the Marketplace."
          echo "See docs/publishing.md for the Entra ID (recommended) and PAT paths."

      - name: Create the GitHub release with the .vsix attached
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/*.vsix
          generate_release_notes: true
          body: |
            ### Install

            - **VS Code extension** — search for *NeoMermaid* in the Marketplace, or
              download the `.vsix` below and run `code --install-extension <file>.vsix`
            - **CLI / SDK** — `npm install -g @neomermaid/cli` (SDK: `@neomermaid/core`)
            - **Live demo** — https://blog.weidows.tech/neomermaid/
            - **Docs** — [theming](docs/theming.md) · [CLI](docs/cli.md) · [SDK](docs/api.md) · [VS Code](docs/vscode.md)
