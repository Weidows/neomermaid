name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Required for npm provenance, and for Entra ID (OIDC) authentication to the
  # Visual Studio Marketplace — neither uses a long-lived secret.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # npm deliberately has NO token here: npm only uses OIDC when no auth env var is
      # present, and a stored token would silently take precedence over trusted
      # publishing. Authentication is OIDC via `id-token: write`.
      # Marketplace authentication. `VSCE_PAT` still works today; Azure DevOps global
      # PATs retire on 2026-12-01, and the documented replacement is Microsoft Entra ID
      # with workload identity federation ("secure automated publishing"), which needs
      # no stored secret at all — see docs/publishing.md.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify the tag matches the package versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(node -p "require('./packages/core/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          VSX=$(node -p "require('./packages/vscode/package.json').version")
          echo "tag=$TAG core=$CORE cli=$CLI vscode=$VSX"
          [ "$TAG" = "$CORE" ] || { echo "tag does not match @neomermaid/core version"; exit 1; }
          [ "$TAG" = "$CLI" ] || { echo "tag does not match @neomermaid/cli version"; exit 1; }

      # Trusted publishing needs npm >= 11.5.1, which the Node 22 image does not ship.
      # Upgrade *after* `npm ci` so dependency install scripts run under the image's npm.
      - name: Use an npm with trusted-publishing support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      # Idempotent: re-running a tag (or moving it) must not fail on an existing version.
      - name: Which packages still need publishing
        id: pending
        shell: bash
        run: |
          V=$(node -p "require('./packages/core/package.json').version")
          pending=""
          for pkg in core cli; do
            if npm view "@neomermaid/$pkg@$V" version >/dev/null 2>&1; then
              echo "@neomermaid/$pkg@$V is already on the registry — skipping"
            else
              pending="$pending $pkg"
            fi
          done
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "pending:$pending"

      - name: Publish @neomermaid/core
        if: contains(steps.pending.outputs.pending, 'core')
        run: npm publish --workspace @neomermaid/core --access public --provenance

      - name: Publish @neomermaid/cli
        if: contains(steps.pending.outputs.pending, 'cli')
        run: npm publish --workspace @neomermaid/cli --access public --provenance

      - name: npm publish failed — how to fix it
        if: failure() && (contains(steps.pending.outputs.pending, 'core') || contains(steps.pending.outputs.pending, 'cli'))
        shell: bash
        run: |
          echo "::error::npm publish failed. If the log says ENEEDAUTH or 404 on a scoped package:"
          echo "  npmjs.com -> the package -> Settings -> Trusted Publisher -> GitHub Actions"
          echo "  owner: Weidows   repository: neomermaid   workflow: release.yml   allow: npm publish"
          echo "  the workflow filename is part of the trust contract — renaming it breaks publishing"
          echo "  a version's FIRST release cannot be published by OIDC; bootstrap it by hand"
          echo "See docs/publishing.md."

      - name: Build the VS Code extension
        run: node scripts/build-vscode.mjs

      - name: Package the .vsix
        run: npm run package --workspace neomermaid-vscode

      # ------------------------------------------------------------------ marketplace
      # Two ways to authenticate, tried in order. Publishing is skipped (with a notice)
      # when neither is configured, so a tag never fails just because the marketplace
      # credentials are missing.

      - name: Log in to Azure with OIDC (Entra ID)
        if: env.VSCE_PAT == '' && env.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Publish to the Marketplace with Entra ID
        if: env.VSCE_PAT == '' && env.AZURE_CLIENT_ID != ''
        run: >-
          npx --yes @vscode/vsce@latest publish
          --packagePath packages/vscode/*.vsix
          --azure-credential

      - name: Publish to the Marketplace with a PAT
        if: env.VSCE_PAT != ''
        run: >-
          npx --yes @vscode/vsce@latest publish
          --packagePath packages/vscode/*.vsix
          --pat "$VSCE_PAT"

      - name: Marketplace skip notice
        if: env.VSCE_PAT == '' && env.AZURE_CLIENT_ID == ''
        run: |
          echo "Not publishing to the Marketplace (no VSCE_PAT or AZURE_CLIENT_ID)."
          echo "The .vsix is attached to this release instead — upload it by hand at"
          echo "https://marketplace.visualstudio.com/manage (no credentials needed)."
          echo "See docs/publishing.md for the PAT and Entra ID automation paths."

      - name: Create the GitHub release with the .vsix attached
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/*.vsix
          generate_release_notes: true
          body: |
            ### Install

            - **VS Code extension** — search for *NeoMermaid* in the Marketplace, or
              download the `.vsix` below and run `code --install-extension <file>.vsix`
            - **CLI / SDK** — `npm install -g @neomermaid/cli` (SDK: `@neomermaid/core`)
            - **Live demo** — https://blog.weidows.tech/neomermaid/
            - **Docs** — [theming](docs/theming.md) · [CLI](docs/cli.md) · [SDK](docs/api.md) · [VS Code](docs/vscode.md)
