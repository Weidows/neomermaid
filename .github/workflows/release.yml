name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Verify the tag matches the package versions
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CORE=$(node -p "require('./packages/core/package.json').version")
          CLI=$(node -p "require('./packages/cli/package.json').version")
          VSX=$(node -p "require('./packages/vscode/package.json').version")
          echo "tag=$TAG core=$CORE cli=$CLI vscode=$VSX"
          [ "$TAG" = "$CORE" ] || { echo "tag does not match @neomermaid/core version"; exit 1; }
          [ "$TAG" = "$CLI" ] || { echo "tag does not match @neomermaid/cli version"; exit 1; }

      - name: Publish @neomermaid/core
        if: env.NPM_TOKEN != ''
        run: npm publish --workspace @neomermaid/core --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Publish @neomermaid/cli
        if: env.NPM_TOKEN != ''
        run: npm publish --workspace @neomermaid/cli --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Skip notice
        if: env.NPM_TOKEN == ''
        run: echo "NPM_TOKEN is not configured — packages were built and tested, but not published."

      - name: Build the VS Code extension
        run: node scripts/build-vscode.mjs

      - name: Package the .vsix
        run: npx --yes @vscode/vsce@latest package --no-dependencies --allow-missing-repository --out neomermaid-vscode.vsix
        working-directory: packages/vscode

      - name: Create the GitHub release with the .vsix attached
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vscode/neomermaid-vscode.vsix
          generate_release_notes: true
          body: |
            ### Install

            - VS Code extension: download `neomermaid-vscode.vsix` below, then
              `code --install-extension neomermaid-vscode.vsix`
            - CLI / SDK: `npm install @neomermaid/cli` (or `@neomermaid/core`)
            - Live demo: https://weidows.github.io/neomermaid/
